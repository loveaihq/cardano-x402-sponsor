# The same checks on Linux, macOS and Windows, on the oldest Node the code supports and a current
# one. Nothing here touches a chain or needs a secret: the tests in test/ sign real transactions
# offline, and the preprod runs in spike/ are not run here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      # The repository's files are LF; a Windows checkout would otherwise turn them into CRLF and
      # test something no one runs.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # bash on every runner, so `pipefail` keeps npm test's exit status through the `tee` that
      # keeps the output for the step after it.
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      # A job's log needs a signed-in viewer; its annotations do not. So a failure names itself.
      - name: name the failures
        if: failure()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}'; }
          notok=$(grep -A 12 -E "^\s*not ok" test-output.txt | head -120 | enc || true)
          [ -n "$notok" ] && echo "::error title=npm test, what did not pass::${notok}"
          echo "::error title=npm test, last 25 lines::$(tail -n 25 test-output.txt | enc)"
      - run: npm run typecheck
